name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test || echo "Sin tests aún"

      - name: Start server
        run: node index.js &
      
      - name: Wait for server
        run: |
          for i in {1..10}; do
            curl -s http://localhost:3005 && exit 0
            sleep 1
          done
          exit 1

      - name: Validate HTML
        run: |
          curl -s http://localhost:3005 | grep -q "<html" || exit 1
