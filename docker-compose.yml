version: '3.8'

services:
  backend:
    image: node:20-alpine
    container_name: sgb-backend
    working_dir: /app
    command: >
      sh -c "
      apk add --no-cache git &&
      git clone https://github.com/IRVINISAEL/backend-biblioteca.git /app &&
      npm install &&
      node src/index.js
      "
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - sgb-network
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: sgb-frontend
    working_dir: /app
    command: >
      sh -c "
      apk add --no-cache git &&
      git clone https://github.com/Rita026/Frontend-biblioteca.git /app &&
      npm install &&
      npm run dev -- --host 0.0.0.0
      "
    ports:
      - "3000:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
    networks:
      - sgb-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  sgb-network:
    driver: bridge
